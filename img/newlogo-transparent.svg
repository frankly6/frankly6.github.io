<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="206" height="56" viewBox="0 0 206 56">
  <title>NOTE</title>
  <!-- Remove the white matte while retaining the original raster letter shapes.
       Alpha derives from red-channel coverage; constant blue avoids white edge halos. -->
  <defs>
    <filter id="remove-white" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feColorMatrix type="matrix" values="0 0 0 0 0.509804  0 0 0 0 0.756863  0 0 0 0 0.890196  -2.04 0 0 0 2.04"/>
    </filter>
  </defs>
  <image width="206" height="56" filter="url(#remove-white)" xlink:href="data:image/png;base64,"/>
</svg>
    <g fill="#200b14" opacity=".42" filter="url(#erode)">
      <path d="M31-71C66-93 150-64 158-12S102 36 121 80 221 97 214 147 159 194 113 165 79 126 30 125-33 71-11 28 2-31 31-71Z"/>

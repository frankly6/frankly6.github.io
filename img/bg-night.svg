      <path d="M14 211C49 176 87 198 110 224S186 230 193 268 146 315 105 292 53 308 25 278-3 241 14 211Z"/>
    </g>
    <g fill="url(#crater)" filter="url(#erode)">
      <ellipse cx="67" cy="55" rx="53" ry="47"/>
      <circle cx="191" cy="29" r="35"/>
      <ellipse cx="166" cy="172" rx="66" ry="58"/>
      <ellipse cx="301" cy="94" rx="31" ry="39"/>
      <ellipse cx="51" cy="244" rx="46" ry="35"/>
      <circle cx="250" cy="264" r="47"/>
      <circle cx="111" cy="325" r="23"/>
      <circle cx="18" cy="146" r="18"/>
      <circle cx="229" cy="108" r="15"/>
      <circle cx="126" cy="104" r="11"/>
      <ellipse cx="345" cy="210" rx="20" ry="27"/>

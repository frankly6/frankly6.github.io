<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1366 768">
  <defs>
    <radialGradient id="blood" cx="30%" cy="25%" r="79%">
      <stop offset="0" stop-color="#b04a3e"/>
      <stop offset=".32" stop-color="#8b292b"/>
      <stop offset=".63" stop-color="#58151d"/>
      <stop offset=".86" stop-color="#2a0b13"/>
      <stop offset="1" stop-color="#100910"/>
    </radialGradient>
    <radialGradient id="crater">
      <stop offset="0" stop-color="#160910" stop-opacity=".48"/>
      <stop offset=".67" stop-color="#260a13" stop-opacity=".32"/>
      <stop offset=".86" stop-color="#c3614c" stop-opacity=".09"/>
      <stop offset="1" stop-color="#6b2026" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shadow" cx="15%" cy="20%" r="91%">
      <stop offset=".35" stop-color="#090810" stop-opacity="0"/>
      <stop offset=".75" stop-color="#090810" stop-opacity=".12"/>
      <stop offset="1" stop-color="#090810" stop-opacity=".85"/>
    </radialGradient>
    <clipPath id="moon"><circle cx="131" cy="85" r="308"/></clipPath>
    <filter id="aura" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="terrain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".018" numOctaves="5" seed="23"/>
      <feColorMatrix type="matrix" values=".6 0 0 0 .08  0 .2 0 0 .01  0 0 .2 0 .02  0 0 0 .62 0"/>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
    <filter id="erode" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".013" numOctaves="3" seed="8" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="31" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>
  <!-- Keep the original moon's position, size, and transparent canvas. -->
  <circle cx="131" cy="85" r="308" fill="none" stroke="#8d1c2b" stroke-width="9" opacity=".22" filter="url(#aura)"/>
  <g clip-path="url(#moon)">
